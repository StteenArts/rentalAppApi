<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Bookings Overview | Atelier Dwelling</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@100..900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        "colors": {
          "tertiary":"#615c54","inverse-primary":"#ffb5a1","surface-container":"#f0eded",
          "on-secondary-fixed":"#161e09","secondary":"#586247","on-primary":"#ffffff",
          "surface-bright":"#fcf9f8","surface-container-low":"#f6f3f2","surface":"#fcf9f8",
          "primary-container":"#b35c44","inverse-on-surface":"#f3f0f0","on-error":"#ffffff",
          "on-primary-fixed-variant":"#79301b","primary-fixed":"#ffdbd1","error":"#ba1a1a",
          "primary":"#94442e","on-surface":"#1b1c1c","primary-fixed-dim":"#ffb5a1",
          "secondary-container":"#dce7c5","error-container":"#ffdad6","secondary-fixed-dim":"#c0cbaa",
          "background":"#fcf9f8","on-tertiary-container":"#fffcff","on-surface-variant":"#55433e",
          "on-tertiary":"#ffffff","on-secondary-container":"#5e684d","on-primary-container":"#fffcff",
          "on-tertiary-fixed-variant":"#4b463f","surface-variant":"#e4e2e1","surface-container-highest":"#e4e2e1",
          "on-background":"#1b1c1c","tertiary-fixed":"#e9e1d7","inverse-surface":"#303030",
          "on-primary-fixed":"#3b0900","outline":"#88726d","surface-dim":"#dcd9d9",
          "surface-tint":"#974730","on-secondary-fixed-variant":"#414a31","on-secondary":"#ffffff",
          "tertiary-fixed-dim":"#cdc5bc","outline-variant":"#dbc1ba","surface-container-high":"#eae7e7",
          "secondary-fixed":"#dce7c5","on-tertiary-fixed":"#1e1b15","on-error-container":"#93000a",
          "surface-container-lowest":"#ffffff","tertiary-container":"#7a746c"
        },
        "borderRadius":{"DEFAULT":"0.125rem","lg":"0.25rem","xl":"0.5rem","full":"0.75rem"},
        "spacing":{"unit":"8px","container-max":"1280px","gutter":"24px","margin-mobile":"20px","margin-desktop":"64px"},
        "fontFamily":{"display-lg":["Playfair Display"],"body-lg":["Inter"],"body-md":["Inter"],"headline-md":["Playfair Display"],"ui-label":["Inter"],"label-caps":["Inter"],"headline-sm":["Playfair Display"],"display-lg-mobile":["Playfair Display"]},
        "fontSize":{
          "display-lg":["48px",{"lineHeight":"1.1","letterSpacing":"-0.02em","fontWeight":"400"}],
          "body-lg":["18px",{"lineHeight":"1.6","fontWeight":"400"}],
          "body-md":["16px",{"lineHeight":"1.5","fontWeight":"400"}],
          "headline-md":["32px",{"lineHeight":"1.2","fontWeight":"400"}],
          "ui-label":["14px",{"lineHeight":"1.2","fontWeight":"500"}],
          "label-caps":["12px",{"lineHeight":"1.0","letterSpacing":"0.15em","fontWeight":"500"}],
          "headline-sm":["24px",{"lineHeight":"1.3","fontWeight":"400"}],
          "display-lg-mobile":["32px",{"lineHeight":"1.2","fontWeight":"400"}]
        }
      }
    }
  }
</script>
<style>
  body { background-color: #fcf9f8; color: #1b1c1c; -webkit-font-smoothing: antialiased; }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24; vertical-align: middle; }
</style>
</head>
<body class="font-body-md text-body-md">
<div id="nav-container"></div>
<main class="max-w-container-max mx-auto px-margin-desktop py-16 min-h-screen">
  <!-- Header -->
  <section class="mb-12">
    <div class="flex flex-col md:flex-row md:items-end justify-between gap-6">
      <div>
        <p class="font-label-caps text-label-caps text-tertiary mb-2">MANAGEMENT CONSOLE</p>
        <h2 class="font-display-lg text-display-lg text-on-surface">Bookings Overview</h2>
      </div>
      <!-- Filter -->
      <div class="flex flex-col gap-2">
        <label class="font-label-caps text-label-caps text-on-surface-variant ml-1">Filter by Property</label>
        <div class="relative min-w-[280px]">
          <select id="prop-filter" class="w-full appearance-none bg-transparent border-b border-outline-variant py-3 px-1 font-ui-label text-ui-label focus:outline-none focus:border-primary cursor-pointer transition-colors">
            <option value="">All Properties</option>
          </select>
          <div class="absolute right-0 top-1/2 -translate-y-1/2 pointer-events-none">
            <span class="material-symbols-outlined text-tertiary">expand_more</span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Stats -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-gutter mb-16">
    <div class="border border-outline-variant p-8 bg-surface-container-lowest">
      <p class="font-label-caps text-label-caps text-tertiary mb-4">TOTAL BOOKINGS</p>
      <p class="font-headline-md text-headline-md text-on-surface"><span id="stat-total">—</span></p>
    </div>
    <div class="border border-outline-variant p-8 bg-surface-container-lowest">
      <p class="font-label-caps text-label-caps text-tertiary mb-4">CONFIRMED</p>
      <p class="font-headline-md text-headline-md text-on-surface"><span id="stat-confirmed">—</span></p>
    </div>
    <div class="border border-outline-variant p-8 bg-surface-container-lowest">
      <p class="font-label-caps text-label-caps text-tertiary mb-4">TOTAL INCOME</p>
      <p class="font-headline-md text-headline-md text-on-surface"><span id="stat-income">—</span></p>
    </div>
  </div>

  <!-- Table -->
  <div class="w-full overflow-x-auto border border-outline-variant bg-surface-container-lowest">
    <table class="w-full text-left border-collapse">
      <thead>
        <tr class="bg-surface-container-low border-b border-outline-variant">
          <th class="py-5 px-6 font-label-caps text-label-caps text-tertiary">Property</th>
          <th class="py-5 px-6 font-label-caps text-label-caps text-tertiary">Guest ID</th>
          <th class="py-5 px-6 font-label-caps text-label-caps text-tertiary">Reservation Dates</th>
          <th class="py-5 px-6 font-label-caps text-label-caps text-tertiary text-right">Total</th>
          <th class="py-5 px-6 font-label-caps text-label-caps text-tertiary">Status</th>
          <th class="py-5 px-6 font-label-caps text-label-caps text-tertiary text-center">Actions</th>
        </tr>
      </thead>
      <tbody id="res-body" class="divide-y divide-outline-variant">
        <tr><td colspan="6" class="py-16 text-center text-tertiary font-body-md">Loading…</td></tr>
      </tbody>
    </table>
  </div>
</main>
<div id="footer-container"></div>
<script src="/js/app.js"></script>
<script>
  document.getElementById('nav-container').innerHTML = buildNav('owner-reservations');
  document.getElementById('footer-container').innerHTML = sharedFooter;

  if (!isLoggedIn() || (!isOwner() && !isAdmin())) {
    window.location.href = isLoggedIn() ? '/index.html' : '/login.html';
  }

  const PLACEHOLDER = 'https://images.unsplash.com/photo-1449844908441-8829872d2607?w=200&q=80';

  let allReservations = [];
  let propertyMap = {};

  function statusBadge(status) {
    const s = (status || '').toLowerCase();
    if (s === 'confirmed') return `<span class="inline-block px-3 py-1 bg-secondary-container text-on-secondary-container text-[11px] font-medium tracking-wider uppercase rounded-sm">Confirmed</span>`;
    if (s === 'cancelled') return `<span class="inline-block px-3 py-1 bg-error-container text-on-error-container text-[11px] font-medium tracking-wider uppercase rounded-sm">Cancelled</span>`;
    return `<span class="inline-block px-3 py-1 bg-surface-container text-tertiary text-[11px] font-medium tracking-wider uppercase rounded-sm">${status}</span>`;
  }

  function renderRows(list) {
    const body = document.getElementById('res-body');
    if (!list.length) {
      body.innerHTML = '<tr><td colspan="6" class="py-16 text-center text-tertiary font-body-md">No reservations found.</td></tr>';
      return;
    }
    body.innerHTML = list.map(r => {
      const prop = propertyMap[r.propertyId] || {};
      const img = prop.images && prop.images.length ? prop.images[0].url : (prop.imageUrl || PLACEHOLDER);
      const cancelled = (r.status || '').toLowerCase() === 'cancelled';
      return `
        <tr class="hover:bg-surface-bright transition-colors group">
          <td class="py-6 px-6">
            <div class="flex items-center gap-4">
              <div class="w-16 h-16 bg-surface-variant rounded-lg overflow-hidden flex-shrink-0">
                <img class="w-full h-full object-cover" src="${img}" alt="${prop.title || '—'}" onerror="this.src='${PLACEHOLDER}'"/>
              </div>
              <div>
                <p class="font-ui-label text-ui-label text-on-surface">${prop.title || '—'}</p>
                <p class="text-[12px] text-tertiary">${prop.city || ''}</p>
              </div>
            </div>
          </td>
          <td class="py-6 px-6">
            <p class="font-ui-label text-ui-label text-on-surface-variant text-[12px] font-mono">${r.userId.slice(0,8)}…</p>
          </td>
          <td class="py-6 px-6">
            <div class="flex items-center gap-2">
              <span class="material-symbols-outlined text-[18px] text-tertiary">calendar_today</span>
              <span class="font-ui-label text-ui-label text-on-surface-variant">${formatDate(r.checkIn)} — ${formatDate(r.checkOut)}</span>
            </div>
          </td>
          <td class="py-6 px-6 text-right">
            <p class="font-ui-label text-ui-label text-on-surface font-semibold">$${Number(r.totalAmount).toFixed(2)}</p>
          </td>
          <td class="py-6 px-6">${statusBadge(r.status)}</td>
          <td class="py-6 px-6 text-center">
            ${!cancelled ? `<button class="cancel-btn p-2 hover:bg-error-container rounded transition-colors text-error" data-id="${r.id}" title="Cancel">
              <span class="material-symbols-outlined text-[18px]">cancel</span>
            </button>` : '<span class="text-tertiary text-[12px]">—</span>'}
          </td>
        </tr>`;
    }).join('');

    body.querySelectorAll('.cancel-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('Cancel this reservation?')) return;
        try {
          await apiFetch('POST', `/reservations/${btn.dataset.id}/cancel`);
          showToast('Reservation cancelled');
          await load();
        } catch(err) { showToast(err.message, true); }
      });
    });
  }

  function updateStats(list) {
    document.getElementById('stat-total').textContent = list.length;
    document.getElementById('stat-confirmed').textContent = list.filter(r => (r.status||'').toLowerCase() === 'confirmed').length;
    const income = list.filter(r => (r.status||'').toLowerCase() !== 'cancelled').reduce((s, r) => s + Number(r.totalAmount), 0);
    document.getElementById('stat-income').textContent = '$' + income.toFixed(2);
  }

  async function load() {
    try {
      const [reservations, props] = await Promise.all([
        apiFetch('GET', '/reservations/owner'),
        apiFetch('GET', isAdmin() ? '/properties' : '/properties/mine')
      ]);
      allReservations = Array.isArray(reservations) ? reservations : [];
      const propList = Array.isArray(props) ? props : (props.items || []);

      propertyMap = {};
      propList.forEach(p => { propertyMap[p.id] = p; });

      // Populate filter
      const sel = document.getElementById('prop-filter');
      sel.innerHTML = '<option value="">All Properties</option>';
      propList.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.id;
        opt.textContent = p.title;
        sel.appendChild(opt);
      });

      updateStats(allReservations);
      renderRows(allReservations);
    } catch(err) {
      document.getElementById('res-body').innerHTML = `<tr><td colspan="6" class="py-12 text-center text-error">${err.message}</td></tr>`;
      showToast(err.message, true);
    }
  }

  document.getElementById('prop-filter').addEventListener('change', e => {
    const pid = e.target.value;
    const filtered = pid ? allReservations.filter(r => r.propertyId === pid) : allReservations;
    updateStats(filtered);
    renderRows(filtered);
  });

  load();
</script>
</body>
</html>
