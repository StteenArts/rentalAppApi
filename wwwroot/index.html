<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Atelier Dwelling | Architectural Retreats</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@100..900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        "colors": {
          "tertiary": "#615c54","inverse-primary": "#ffb5a1","surface-container": "#f0eded",
          "on-secondary-fixed": "#161e09","secondary": "#586247","on-primary": "#ffffff",
          "surface-bright": "#fcf9f8","surface-container-low": "#f6f3f2","surface": "#fcf9f8",
          "primary-container": "#b35c44","inverse-on-surface": "#f3f0f0","on-error": "#ffffff",
          "on-primary-fixed-variant": "#79301b","primary-fixed": "#ffdbd1","error": "#ba1a1a",
          "primary": "#94442e","on-surface": "#1b1c1c","primary-fixed-dim": "#ffb5a1",
          "secondary-container": "#dce7c5","error-container": "#ffdad6","secondary-fixed-dim": "#c0cbaa",
          "background": "#fcf9f8","on-tertiary-container": "#fffcff","on-surface-variant": "#55433e",
          "on-tertiary": "#ffffff","on-secondary-container": "#5e684d","on-primary-container": "#fffcff",
          "on-tertiary-fixed-variant": "#4b463f","surface-variant": "#e4e2e1","surface-container-highest": "#e4e2e1",
          "on-background": "#1b1c1c","tertiary-fixed": "#e9e1d7","inverse-surface": "#303030",
          "on-primary-fixed": "#3b0900","outline": "#88726d","surface-dim": "#dcd9d9",
          "surface-tint": "#974730","on-secondary-fixed-variant": "#414a31","on-secondary": "#ffffff",
          "tertiary-fixed-dim": "#cdc5bc","outline-variant": "#dbc1ba","surface-container-high": "#eae7e7",
          "secondary-fixed": "#dce7c5","on-tertiary-fixed": "#1e1b15","on-error-container": "#93000a",
          "surface-container-lowest": "#ffffff","tertiary-container": "#7a746c"
        },
        "borderRadius": {"DEFAULT": "0.125rem","lg": "0.25rem","xl": "0.5rem","full": "0.75rem"},
        "spacing": {"unit": "8px","container-max": "1280px","gutter": "24px","margin-mobile": "20px","margin-desktop": "64px"},
        "fontFamily": {"display-lg": ["Playfair Display"],"body-lg": ["Inter"],"body-md": ["Inter"],"headline-md": ["Playfair Display"],"ui-label": ["Inter"],"label-caps": ["Inter"],"headline-sm": ["Playfair Display"],"display-lg-mobile": ["Playfair Display"]},
        "fontSize": {
          "display-lg": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "400"}],
          "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
          "body-md": ["16px", {"lineHeight": "1.5", "fontWeight": "400"}],
          "headline-md": ["32px", {"lineHeight": "1.2", "fontWeight": "400"}],
          "ui-label": ["14px", {"lineHeight": "1.2", "fontWeight": "500"}],
          "label-caps": ["12px", {"lineHeight": "1.0", "letterSpacing": "0.15em", "fontWeight": "500"}],
          "headline-sm": ["24px", {"lineHeight": "1.3", "fontWeight": "400"}],
          "display-lg-mobile": ["32px", {"lineHeight": "1.2", "fontWeight": "400"}]
        }
      },
    },
  }
</script>
<style>
  body { background-color: #fcf9f8; color: #1b1c1c; }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24; }
  .property-card:hover .tooltip { opacity: 1; transform: translateY(0); }
  .editorial-shadow { box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
  .custom-scrollbar::-webkit-scrollbar { width: 4px; }
  .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
  .custom-scrollbar::-webkit-scrollbar-thumb { background: #e4e2e1; }
</style>
</head>
<body class="font-body-md text-body-md selection:bg-primary-fixed selection:text-on-primary-fixed">
<div id="nav-container"></div>
<main class="max-w-container-max mx-auto px-margin-desktop">
  <!-- Hero Search Section -->
  <section class="py-24 md:py-32 flex flex-col items-center text-center">
    <h1 class="font-display-lg text-display-lg max-w-3xl mb-12">
      Curating <span class="italic text-primary">architectural intentionality</span> for the discerning traveler.
    </h1>
    <div class="w-full max-w-4xl bg-white border border-outline-variant p-2 rounded-xl flex flex-col md:flex-row items-center gap-2 editorial-shadow">
      <div class="flex-1 w-full flex flex-col items-start px-6 py-3 border-r border-outline-variant/30">
        <span class="font-label-caps text-label-caps text-tertiary mb-1 uppercase">Where</span>
        <input id="search-city" class="w-full bg-transparent border-none p-0 focus:ring-0 text-on-surface placeholder:text-outline/60 font-body-md" placeholder="Search destinations" type="text"/>
      </div>
      <button id="search-btn" class="w-full md:w-auto bg-primary text-on-primary px-10 py-4 rounded-lg font-ui-label text-ui-label hover:bg-primary-container transition-colors flex items-center justify-center gap-2">
        <span class="material-symbols-outlined text-sm">search</span>
        Search
      </button>
    </div>
  </section>
  <!-- Divider -->
  <div class="w-full h-px bg-outline-variant mb-20"></div>
  <!-- Property Grid -->
  <section class="mb-32">
    <div class="flex justify-between items-end mb-10">
      <div>
        <span class="font-label-caps text-label-caps text-primary tracking-[0.2em] uppercase mb-2 block">The Collection</span>
        <h2 class="font-headline-md text-headline-md">Selected Dwellings</h2>
      </div>
    </div>
    <div id="properties-grid" class="grid grid-cols-1 md:grid-cols-3 gap-x-gutter gap-y-16">
      <!-- cards injected by JS -->
    </div>
    <div id="empty-state" class="hidden flex flex-col items-center justify-center py-32 text-center">
      <p class="font-headline-sm text-headline-sm text-tertiary mb-4">No properties found</p>
      <p class="font-body-md text-tertiary">Try a different search term.</p>
    </div>
  </section>
</main>
<div id="footer-container"></div>
<script src="/js/app.js"></script>
<script>
  document.getElementById('nav-container').innerHTML = buildNav('explore');
  document.getElementById('footer-container').innerHTML = sharedFooter;

  const PLACEHOLDER = 'https://images.unsplash.com/photo-1449844908441-8829872d2607?w=800&q=80';

  function renderCard(p) {
    const img = getPropertyImage(p);
    const loggedIn = isLoggedIn();
    const heartBtn = loggedIn
      ? `<button class="heart-btn w-10 h-10 bg-white/90 backdrop-blur rounded-full flex items-center justify-center text-outline hover:text-primary transition-colors" data-id="${p.id}">
           <span class="material-symbols-outlined text-[20px]">favorite</span>
         </button>`
      : `<div class="relative group/heart">
           <button class="w-10 h-10 bg-white/90 backdrop-blur rounded-full flex items-center justify-center text-outline cursor-default">
             <span class="material-symbols-outlined text-[20px]">favorite</span>
           </button>
           <div class="tooltip opacity-0 transform translate-y-2 absolute right-0 top-12 bg-on-surface text-white text-[10px] py-1 px-3 rounded whitespace-nowrap pointer-events-none transition-all duration-300 font-ui-label">
             Log in to save
           </div>
         </div>`;

    return `
      <div class="property-card group cursor-pointer" data-id="${p.id}">
        <div class="relative overflow-hidden aspect-[4/5] rounded-xl mb-6 bg-surface-container-low">
          <img class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700 ease-out" src="${img}" alt="${p.title}" onerror="this.src='${PLACEHOLDER}'"/>
          <div class="absolute top-4 right-4 z-10">${heartBtn}</div>
        </div>
        <div class="flex justify-between items-start">
          <div>
            <h3 class="font-headline-sm text-headline-sm mb-1">${p.title}</h3>
            <p class="text-tertiary font-ui-label text-ui-label uppercase tracking-wider mb-4">${p.city}</p>
            <p class="font-body-md text-on-surface">$${p.pricePerNight} <span class="text-tertiary font-normal">/ night</span></p>
          </div>
        </div>
      </div>`;
  }

  async function loadProperties(city) {
    const grid = document.getElementById('properties-grid');
    const empty = document.getElementById('empty-state');
    grid.innerHTML = '<p class="col-span-3 text-center text-tertiary py-20">Loading...</p>';
    empty.classList.add('hidden');
    try {
      const url = city ? `/properties/search?city=${encodeURIComponent(city)}` : '/properties';
      const props = await apiFetch('GET', url);
      const list = Array.isArray(props) ? props : (props.items || props.data || []);
      grid.innerHTML = '';
      if (!list.length) { empty.classList.remove('hidden'); return; }
      list.forEach(p => { grid.insertAdjacentHTML('beforeend', renderCard(p)); });
      // card click
      grid.querySelectorAll('.property-card').forEach(card => {
        card.addEventListener('click', (e) => {
          if (e.target.closest('.heart-btn') || e.target.closest('.relative.group\\/heart')) return;
          window.location.href = `/property.html?id=${card.dataset.id}`;
        });
      });
      // heart click
      grid.querySelectorAll('.heart-btn').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          try {
            await apiFetch('POST', '/wishlist/toggle', { propertyId: btn.dataset.id });
            const icon = btn.querySelector('.material-symbols-outlined');
            const filled = icon.style.fontVariationSettings && icon.style.fontVariationSettings.includes("'FILL' 1");
            icon.style.fontVariationSettings = filled ? "'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24" : "'FILL' 1, 'wght' 300, 'GRAD' 0, 'opsz' 24";
            icon.classList.toggle('text-primary', !filled);
            showToast(filled ? 'Removed from wishlist' : 'Saved to wishlist');
          } catch(err) { showToast(err.message, true); }
        });
      });
    } catch(err) {
      grid.innerHTML = '';
      showToast(err.message, true);
      empty.classList.remove('hidden');
    }
  }

  document.getElementById('search-btn').addEventListener('click', () => {
    const city = document.getElementById('search-city').value.trim();
    loadProperties(city);
  });
  document.getElementById('search-city').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('search-btn').click();
  });

  loadProperties();
</script>
</body>
</html>
