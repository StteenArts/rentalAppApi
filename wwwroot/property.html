<!DOCTYPE html>
<html class="scroll-smooth" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Property | Atelier Dwelling</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@100..900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        "colors": {
          "tertiary": "#615c54","inverse-primary": "#ffb5a1","surface-container": "#f0eded",
          "on-secondary-fixed": "#161e09","secondary": "#586247","on-primary": "#ffffff",
          "surface-bright": "#fcf9f8","surface-container-low": "#f6f3f2","surface": "#fcf9f8",
          "primary-container": "#b35c44","inverse-on-surface": "#f3f0f0","on-error": "#ffffff",
          "on-primary-fixed-variant": "#79301b","primary-fixed": "#ffdbd1","error": "#ba1a1a",
          "primary": "#94442e","on-surface": "#1b1c1c","primary-fixed-dim": "#ffb5a1",
          "secondary-container": "#dce7c5","error-container": "#ffdad6","secondary-fixed-dim": "#c0cbaa",
          "background": "#fcf9f8","on-tertiary-container": "#fffcff","on-surface-variant": "#55433e",
          "on-tertiary": "#ffffff","on-secondary-container": "#5e684d","on-primary-container": "#fffcff",
          "on-tertiary-fixed-variant": "#4b463f","surface-variant": "#e4e2e1","surface-container-highest": "#e4e2e1",
          "on-background": "#1b1c1c","tertiary-fixed": "#e9e1d7","inverse-surface": "#303030",
          "on-primary-fixed": "#3b0900","outline": "#88726d","surface-dim": "#dcd9d9",
          "surface-tint": "#974730","on-secondary-fixed-variant": "#414a31","on-secondary": "#ffffff",
          "tertiary-fixed-dim": "#cdc5bc","outline-variant": "#dbc1ba","surface-container-high": "#eae7e7",
          "secondary-fixed": "#dce7c5","on-tertiary-fixed": "#1e1b15","on-error-container": "#93000a",
          "surface-container-lowest": "#ffffff","tertiary-container": "#7a746c"
        },
        "borderRadius": {"DEFAULT": "0.125rem","lg": "0.25rem","xl": "0.5rem","full": "0.75rem"},
        "spacing": {"unit": "8px","container-max": "1280px","gutter": "24px","margin-mobile": "20px","margin-desktop": "64px"},
        "fontFamily": {"display-lg": ["Playfair Display"],"body-lg": ["Inter"],"body-md": ["Inter"],"headline-md": ["Playfair Display"],"ui-label": ["Inter"],"label-caps": ["Inter"],"headline-sm": ["Playfair Display"],"display-lg-mobile": ["Playfair Display"]},
        "fontSize": {
          "display-lg": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "400"}],
          "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
          "body-md": ["16px", {"lineHeight": "1.5", "fontWeight": "400"}],
          "headline-md": ["32px", {"lineHeight": "1.2", "fontWeight": "400"}],
          "ui-label": ["14px", {"lineHeight": "1.2", "fontWeight": "500"}],
          "label-caps": ["12px", {"lineHeight": "1.0", "letterSpacing": "0.15em", "fontWeight": "500"}],
          "headline-sm": ["24px", {"lineHeight": "1.3", "fontWeight": "400"}],
          "display-lg-mobile": ["32px", {"lineHeight": "1.2", "fontWeight": "400"}]
        }
      },
    },
  }
</script>
<style>
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24; }
  .sticky-widget { position: sticky; top: calc(64px + 2rem); }
  .editorial-line-height { line-height: 1.8; }
</style>
</head>
<body class="bg-background text-on-background font-body-md selection:bg-primary-fixed selection:text-on-primary-fixed overflow-x-hidden">
<div id="nav-container"></div>
<main class="max-w-container-max mx-auto px-margin-desktop pt-12 pb-32">
  <!-- Breadcrumb / Header Meta -->
  <div class="flex flex-col gap-4 mb-10" id="property-header">
    <div class="animate-pulse h-8 bg-surface-container-low rounded w-64"></div>
  </div>
  <!-- Image Gallery Mosaic -->
  <section id="gallery" class="grid grid-cols-12 grid-rows-2 gap-4 h-[600px] mb-20 overflow-hidden">
    <div class="col-span-12 flex items-center justify-center bg-surface-container-low rounded-lg">
      <p class="text-tertiary">Loading images...</p>
    </div>
  </section>
  <!-- Main Content & Sticky Widget -->
  <div class="grid grid-cols-12 gap-gutter items-start">
    <!-- Editorial Column -->
    <article class="col-span-12 lg:col-span-8 flex flex-col gap-12">
      <section class="max-w-2xl" id="property-description">
        <div class="animate-pulse space-y-4">
          <div class="h-6 bg-surface-container-low rounded w-3/4"></div>
          <div class="h-4 bg-surface-container-low rounded"></div>
          <div class="h-4 bg-surface-container-low rounded w-5/6"></div>
        </div>
      </section>
    </article>
    <!-- Booking Widget -->
    <aside class="col-span-12 lg:col-span-4 sticky-widget">
      <div class="bg-surface border border-outline-variant p-8 flex flex-col gap-8 shadow-sm" id="booking-widget">
        <div class="animate-pulse space-y-4">
          <div class="h-6 bg-surface-container-low rounded w-1/2"></div>
          <div class="h-20 bg-surface-container-low rounded"></div>
        </div>
      </div>
      <div class="mt-8 flex items-center justify-center gap-4 text-tertiary">
        <span class="material-symbols-outlined text-xl">verified_user</span>
        <span class="text-xs font-ui-label">Verified Architectural Listing</span>
      </div>
    </aside>
  </div>
</main>
<div id="footer-container"></div>
<script src="/js/app.js"></script>
<script>
  document.getElementById('nav-container').innerHTML = buildNav('explore');
  document.getElementById('footer-container').innerHTML = sharedFooter;

  const params = new URLSearchParams(location.search);
  const propertyId = params.get('id');
  if (!propertyId) window.location.href = '/index.html';

  const PLACEHOLDER = 'https://images.unsplash.com/photo-1449844908441-8829872d2607?w=800&q=80';

  async function loadProperty() {
    try {
      const p = await apiFetch('GET', `/properties/${propertyId}`);
      document.title = `${p.title} | Atelier Dwelling`;

      // Header
      document.getElementById('property-header').innerHTML = `
        <div class="flex items-center gap-2 text-on-surface-variant">
          <span class="font-label-caps text-label-caps uppercase tracking-widest">Architecture</span>
        </div>
        <div class="flex justify-between items-end">
          <div>
            <h1 class="font-display-lg text-display-lg text-on-surface mb-2">${p.title}</h1>
            <p class="font-body-lg text-body-lg text-tertiary flex items-center gap-2">
              <span class="material-symbols-outlined text-sm">location_on</span>
              ${p.city}
            </p>
          </div>
          <div class="flex gap-4">
            <button id="save-btn" class="flex items-center gap-2 px-4 py-2 border border-outline-variant hover:bg-surface-container-low transition-colors rounded-DEFAULT">
              <span class="material-symbols-outlined text-lg">favorite</span>
              <span class="font-ui-label text-ui-label">Save</span>
            </button>
          </div>
        </div>`;

      // Gallery
      const images = p.images && p.images.length > 0 ? p.images : [{ url: p.imageUrl || PLACEHOLDER, isMain: true }];
      const mainImg = images.find(i => i.isMain) || images[0];
      const others = images.filter(i => !i.isMain).slice(0, 4);
      let galleryHtml = `
        <div class="col-span-8 row-span-2 relative group overflow-hidden rounded-lg border border-outline-variant">
          <img class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700" src="${mainImg.url || PLACEHOLDER}" alt="${p.title}" onerror="this.src='${PLACEHOLDER}'"/>
        </div>`;
      for (let i = 0; i < 4; i++) {
        const img = others[i];
        const isLast = i === 3 && images.length > 5;
        galleryHtml += `
          <div class="col-span-2 row-span-1 relative group overflow-hidden rounded-lg border border-outline-variant">
            ${isLast ? `<div class="absolute inset-0 flex items-center justify-center bg-on-surface/40 z-10"><span class="text-white font-ui-label text-ui-label">+ ${images.length - 5} Photos</span></div>` : ''}
            <img class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700" src="${img ? (img.url || PLACEHOLDER) : PLACEHOLDER}" alt="${p.title}" onerror="this.src='${PLACEHOLDER}'"/>
          </div>`;
      }
      // Fill remaining slots
      for (let i = others.length; i < 4; i++) {
        galleryHtml += `<div class="col-span-2 row-span-1 rounded-lg border border-outline-variant bg-surface-container-low"></div>`;
      }
      document.getElementById('gallery').innerHTML = galleryHtml;

      // Description
      document.getElementById('property-description').innerHTML = `
        <h2 class="font-headline-md text-headline-md text-on-surface mb-6">${p.title}</h2>
        <div class="font-body-lg text-body-lg text-tertiary editorial-line-height flex flex-col gap-6">
          <p>${p.description || 'A curated architectural retreat offering an unparalleled experience of space, light, and material.'}</p>
        </div>`;

      // Booking widget
      renderBookingWidget(p);

      // Save btn
      if (isLoggedIn()) {
        document.getElementById('save-btn').addEventListener('click', async () => {
          try {
            await apiFetch('POST', '/wishlist/toggle', { propertyId: p.id });
            showToast('Wishlist updated');
          } catch(err) { showToast(err.message, true); }
        });
      } else {
        document.getElementById('save-btn').addEventListener('click', () => {
          window.location.href = '/login.html';
        });
      }
    } catch(err) {
      showToast(err.message, true);
    }
  }

  function renderBookingWidget(p) {
    const today = new Date().toISOString().split('T')[0];
    const tomorrow = new Date(Date.now() + 86400000).toISOString().split('T')[0];
    document.getElementById('booking-widget').innerHTML = `
      <div class="flex justify-between items-baseline">
        <div class="flex items-baseline gap-2">
          <span class="font-headline-sm text-headline-sm text-on-surface">$${p.pricePerNight}</span>
          <span class="text-tertiary font-ui-label text-ui-label">/ night</span>
        </div>
      </div>
      <div class="border border-outline-variant divide-y divide-outline-variant">
        <div class="grid grid-cols-2 divide-x divide-outline-variant">
          <div class="p-4 flex flex-col gap-1">
            <label class="font-label-caps text-[10px] uppercase tracking-wider text-on-surface-variant" for="check-in">Check-in</label>
            <input type="date" id="check-in" class="bg-transparent border-none p-0 focus:ring-0 font-body-md text-on-surface text-sm" value="${today}" min="${today}"/>
          </div>
          <div class="p-4 flex flex-col gap-1">
            <label class="font-label-caps text-[10px] uppercase tracking-wider text-on-surface-variant" for="check-out">Check-out</label>
            <input type="date" id="check-out" class="bg-transparent border-none p-0 focus:ring-0 font-body-md text-on-surface text-sm" value="${tomorrow}" min="${tomorrow}"/>
          </div>
        </div>
      </div>
      <div class="flex flex-col gap-4 pt-2" id="price-breakdown">
        <div class="flex justify-between text-body-md">
          <span class="text-tertiary" id="nights-label">$${p.pricePerNight} x 1 night</span>
          <span class="text-on-surface font-medium" id="nights-total">$${p.pricePerNight}</span>
        </div>
        <hr class="border-outline-variant my-2"/>
        <div class="flex justify-between items-baseline">
          <span class="font-headline-sm text-headline-sm">Total</span>
          <span class="font-headline-sm text-headline-sm text-primary" id="grand-total">$${p.pricePerNight}</span>
        </div>
      </div>
      <button id="reserve-btn" class="w-full bg-primary-container text-on-primary-container py-4 font-ui-label text-ui-label rounded-DEFAULT hover:opacity-90 transition-opacity flex justify-center items-center gap-2">
        ${isLoggedIn() ? 'Reserve' : 'Login to Reserve'}
      </button>
      <p class="text-center text-xs text-tertiary font-ui-label">You won't be charged yet</p>`;

    const updatePrice = () => {
      const ci = document.getElementById('check-in').value;
      const co = document.getElementById('check-out').value;
      const nights = nightsBetween(ci, co);
      const total = nights * p.pricePerNight;
      document.getElementById('nights-label').textContent = `$${p.pricePerNight} x ${nights} night${nights !== 1 ? 's' : ''}`;
      document.getElementById('nights-total').textContent = `$${total}`;
      document.getElementById('grand-total').textContent = `$${total}`;
    };
    document.getElementById('check-in').addEventListener('change', updatePrice);
    document.getElementById('check-out').addEventListener('change', updatePrice);
    updatePrice();

    document.getElementById('reserve-btn').addEventListener('click', () => {
      if (!isLoggedIn()) { window.location.href = '/login.html'; return; }
      const ci = document.getElementById('check-in').value;
      const co = document.getElementById('check-out').value;
      window.location.href = `/checkout.html?id=${p.id}&checkIn=${ci}&checkOut=${co}`;
    });
  }

  loadProperty();
</script>
</body>
</html>
