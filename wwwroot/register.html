<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Register | Atelier Dwelling</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@100..900&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        "colors": {
          "tertiary": "#615c54","inverse-primary": "#ffb5a1","surface-container": "#f0eded",
          "on-secondary-fixed": "#161e09","secondary": "#586247","on-primary": "#ffffff",
          "surface-bright": "#fcf9f8","surface-container-low": "#f6f3f2","surface": "#fcf9f8",
          "primary-container": "#b35c44","inverse-on-surface": "#f3f0f0","on-error": "#ffffff",
          "on-primary-fixed-variant": "#79301b","primary-fixed": "#ffdbd1","error": "#ba1a1a",
          "primary": "#94442e","on-surface": "#1b1c1c","primary-fixed-dim": "#ffb5a1",
          "secondary-container": "#dce7c5","error-container": "#ffdad6","secondary-fixed-dim": "#c0cbaa",
          "background": "#fcf9f8","on-tertiary-container": "#fffcff","on-surface-variant": "#55433e",
          "on-tertiary": "#ffffff","on-secondary-container": "#5e684d","on-primary-container": "#fffcff",
          "on-tertiary-fixed-variant": "#4b463f","surface-variant": "#e4e2e1","surface-container-highest": "#e4e2e1",
          "on-background": "#1b1c1c","tertiary-fixed": "#e9e1d7","inverse-surface": "#303030",
          "on-primary-fixed": "#3b0900","outline": "#88726d","surface-dim": "#dcd9d9",
          "surface-tint": "#974730","on-secondary-fixed-variant": "#414a31","on-secondary": "#ffffff",
          "tertiary-fixed-dim": "#cdc5bc","outline-variant": "#dbc1ba","surface-container-high": "#eae7e7",
          "secondary-fixed": "#dce7c5","on-tertiary-fixed": "#1e1b15","on-error-container": "#93000a",
          "surface-container-lowest": "#ffffff","tertiary-container": "#7a746c"
        },
        "borderRadius": {"DEFAULT": "0.125rem","lg": "0.25rem","xl": "0.5rem","full": "0.75rem"},
        "spacing": {"unit": "8px","container-max": "1280px","gutter": "24px","margin-mobile": "20px","margin-desktop": "64px"},
        "fontFamily": {"display-lg": ["Playfair Display"],"body-lg": ["Inter"],"body-md": ["Inter"],"headline-md": ["Playfair Display"],"ui-label": ["Inter"],"label-caps": ["Inter"],"headline-sm": ["Playfair Display"],"display-lg-mobile": ["Playfair Display"]},
        "fontSize": {
          "display-lg": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "400"}],
          "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
          "body-md": ["16px", {"lineHeight": "1.5", "fontWeight": "400"}],
          "headline-md": ["32px", {"lineHeight": "1.2", "fontWeight": "400"}],
          "ui-label": ["14px", {"lineHeight": "1.2", "fontWeight": "500"}],
          "label-caps": ["12px", {"lineHeight": "1.0", "letterSpacing": "0.15em", "fontWeight": "500"}],
          "headline-sm": ["24px", {"lineHeight": "1.3", "fontWeight": "400"}],
          "display-lg-mobile": ["32px", {"lineHeight": "1.2", "fontWeight": "400"}]
        }
      },
    },
  }
</script>
<style>
  body { background-color: #fcf9f8; color: #1b1c1c; -webkit-font-smoothing: antialiased; }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
  .editorial-overlay { background: linear-gradient(0deg, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0) 50%); }
  .custom-input { border: none; border-bottom: 1px solid #E5DDD3; background: transparent; padding: 12px 0; border-radius: 0; outline: none !important; box-shadow: none !important; }
  .custom-input:focus { border-bottom: 1px solid #94442e; }
  .role-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); border: 1px solid #E5DDD3; }
  .role-card.active { border-color: #94442e; background-color: #f6f3f2; }
</style>
</head>
<body class="font-body-md text-body-md overflow-x-hidden">
<main class="min-h-screen flex flex-col md:flex-row">
  <!-- Left: Editorial Image -->
  <section class="relative w-full md:w-5/12 h-64 md:h-screen overflow-hidden">
    <div class="absolute inset-0 z-0">
      <img class="w-full h-full object-cover" src="https://images.unsplash.com/photo-1518780664697-55e3ad937233?w=1200&q=80" alt="Architectural retreat"/>
    </div>
    <div class="absolute inset-0 editorial-overlay z-10"></div>
    <div class="absolute bottom-margin-desktop left-margin-desktop z-20 text-on-primary max-w-sm hidden md:block">
      <p class="font-label-caps text-label-caps mb-4 tracking-widest opacity-80 uppercase">The Art of Living</p>
      <h1 class="font-display-lg text-display-lg mb-6 leading-tight">Curating architectural intentionality.</h1>
      <p class="font-body-lg text-body-lg opacity-90">Discover a collection of dwellings designed for the discerning traveler.</p>
    </div>
    <div class="absolute top-8 left-8 z-20 md:hidden">
      <span class="font-headline-md text-headline-md text-on-primary">Atelier Dwelling</span>
    </div>
  </section>
  <!-- Right: Registration Form -->
  <section class="w-full md:w-7/12 flex flex-col justify-center items-center px-margin-mobile md:px-margin-desktop py-12 md:py-0 bg-surface">
    <div class="w-full max-w-md">
      <div class="mb-10 text-left">
        <span class="hidden md:block font-headline-md text-headline-md text-primary mb-12">Atelier Dwelling</span>
        <h2 class="font-headline-sm text-headline-sm text-on-surface mb-2">Create your account</h2>
        <p class="font-body-md text-tertiary">Join our community of architects and wanderers.</p>
      </div>
      <form class="space-y-8" id="registrationForm">
        <!-- Account Type Selector -->
        <div>
          <span class="font-label-caps text-label-caps text-tertiary mb-4 block uppercase">Account Type</span>
          <div class="grid grid-cols-2 gap-4">
            <button class="role-card active flex flex-col p-6 text-left hover:border-primary" id="role-guest" onclick="selectRole('guest')" type="button">
              <span class="material-symbols-outlined text-primary mb-3">explore</span>
              <span class="font-ui-label text-ui-label text-on-surface">I want to book</span>
              <span class="font-label-caps text-[10px] text-tertiary mt-1 uppercase">(Guest)</span>
            </button>
            <button class="role-card flex flex-col p-6 text-left hover:border-primary" id="role-owner" onclick="selectRole('owner')" type="button">
              <span class="material-symbols-outlined text-tertiary mb-3">house</span>
              <span class="font-ui-label text-ui-label text-on-surface">I want to host</span>
              <span class="font-label-caps text-[10px] text-tertiary mt-1 uppercase">(Owner)</span>
            </button>
          </div>
        </div>
        <!-- Input Fields -->
        <div class="space-y-6">
          <div class="flex flex-col">
            <label class="font-label-caps text-label-caps text-tertiary uppercase" for="fullName">Full Name</label>
            <input class="custom-input font-body-md text-on-surface" id="fullName" placeholder="E.g. Julian Vayne" required type="text"/>
          </div>
          <div class="flex flex-col">
            <label class="font-label-caps text-label-caps text-tertiary uppercase" for="email">Email Address</label>
            <input class="custom-input font-body-md text-on-surface" id="email" placeholder="hello@atelier.com" required type="email"/>
          </div>
          <div class="flex flex-col">
            <label class="font-label-caps text-label-caps text-tertiary uppercase" for="password">Password</label>
            <input class="custom-input font-body-md text-on-surface" id="password" placeholder="••••••••" required type="password"/>
          </div>
        </div>
        <div id="form-error" class="hidden text-error text-sm font-ui-label bg-error-container px-4 py-3 rounded"></div>
        <!-- Action -->
        <div class="pt-4 flex flex-col gap-6">
          <button class="w-full bg-primary-container text-on-primary py-4 font-ui-label text-ui-label uppercase tracking-widest hover:opacity-90 transition-all duration-300" type="submit" id="submit-btn">
            Create Account
          </button>
          <p class="text-center font-ui-label text-ui-label text-tertiary">
            Already have an account?
            <a class="text-primary font-bold hover:underline ml-1" href="/login.html">Login</a>
          </p>
        </div>
      </form>
    </div>
  </section>
</main>
<script src="/js/app.js"></script>
<script>
  if (isLoggedIn()) window.location.href = '/index.html';

  let selectedRole = 'Guest';

  function selectRole(role) {
    const guestBtn = document.getElementById('role-guest');
    const ownerBtn = document.getElementById('role-owner');
    const guestIcon = guestBtn.querySelector('.material-symbols-outlined');
    const ownerIcon = ownerBtn.querySelector('.material-symbols-outlined');
    if (role === 'guest') {
      selectedRole = 'Guest';
      guestBtn.classList.add('active'); ownerBtn.classList.remove('active');
      guestIcon.classList.add('text-primary'); guestIcon.classList.remove('text-tertiary');
      ownerIcon.classList.add('text-tertiary'); ownerIcon.classList.remove('text-primary');
    } else {
      selectedRole = 'Owner';
      ownerBtn.classList.add('active'); guestBtn.classList.remove('active');
      ownerIcon.classList.add('text-primary'); ownerIcon.classList.remove('text-tertiary');
      guestIcon.classList.add('text-tertiary'); guestIcon.classList.remove('text-primary');
    }
  }

  document.getElementById('registrationForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const errDiv = document.getElementById('form-error');
    errDiv.classList.add('hidden');
    btn.disabled = true;
    btn.textContent = 'Creating Account...';
    try {
      await apiFetch('POST', '/auth/register', {
        fullName: document.getElementById('fullName').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
        role: selectedRole
      });
      // Auto-login after register
      const data = await apiFetch('POST', '/auth/login', {
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      });
      localStorage.setItem('token', data.token);
      localStorage.setItem('user', JSON.stringify(data.user || data));
      const user = data.user || data;
      window.location.href = (user.role === 'Owner' || user.role === 'Admin') ? '/my-properties.html' : '/index.html';
    } catch(err) {
      errDiv.textContent = err.message || 'Registration failed. Please try again.';
      errDiv.classList.remove('hidden');
      btn.disabled = false;
      btn.textContent = 'Create Account';
    }
  });
</script>
</body>
</html>
