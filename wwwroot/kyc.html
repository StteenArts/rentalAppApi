<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Identity Verification | Atelier Dwelling</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@100..900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        "colors": {
          "tertiary": "#615c54","inverse-primary": "#ffb5a1","surface-container": "#f0eded",
          "on-secondary-fixed": "#161e09","secondary": "#586247","on-primary": "#ffffff",
          "surface-bright": "#fcf9f8","surface-container-low": "#f6f3f2","surface": "#fcf9f8",
          "primary-container": "#b35c44","inverse-on-surface": "#f3f0f0","on-error": "#ffffff",
          "on-primary-fixed-variant": "#79301b","primary-fixed": "#ffdbd1","error": "#ba1a1a",
          "primary": "#94442e","on-surface": "#1b1c1c","primary-fixed-dim": "#ffb5a1",
          "secondary-container": "#dce7c5","error-container": "#ffdad6","secondary-fixed-dim": "#c0cbaa",
          "background": "#fcf9f8","on-tertiary-container": "#fffcff","on-surface-variant": "#55433e",
          "on-tertiary": "#ffffff","on-secondary-container": "#5e684d","on-primary-container": "#fffcff",
          "on-tertiary-fixed-variant": "#4b463f","surface-variant": "#e4e2e1","surface-container-highest": "#e4e2e1",
          "on-background": "#1b1c1c","tertiary-fixed": "#e9e1d7","inverse-surface": "#303030",
          "on-primary-fixed": "#3b0900","outline": "#88726d","surface-dim": "#dcd9d9",
          "surface-tint": "#974730","on-secondary-fixed-variant": "#414a31","on-secondary": "#ffffff",
          "tertiary-fixed-dim": "#cdc5bc","outline-variant": "#dbc1ba","surface-container-high": "#eae7e7",
          "secondary-fixed": "#dce7c5","on-tertiary-fixed": "#1e1b15","on-error-container": "#93000a",
          "surface-container-lowest": "#ffffff","tertiary-container": "#7a746c"
        },
        "borderRadius": {"DEFAULT": "0.125rem","lg": "0.25rem","xl": "0.5rem","full": "0.75rem"},
        "spacing": {"unit": "8px","container-max": "1280px","gutter": "24px","margin-mobile": "20px","margin-desktop": "64px"},
        "fontFamily": {"display-lg": ["Playfair Display"],"body-lg": ["Inter"],"body-md": ["Inter"],"headline-md": ["Playfair Display"],"ui-label": ["Inter"],"label-caps": ["Inter"],"headline-sm": ["Playfair Display"],"display-lg-mobile": ["Playfair Display"]},
        "fontSize": {
          "display-lg": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "400"}],
          "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
          "body-md": ["16px", {"lineHeight": "1.5", "fontWeight": "400"}],
          "headline-md": ["32px", {"lineHeight": "1.2", "fontWeight": "400"}],
          "ui-label": ["14px", {"lineHeight": "1.2", "fontWeight": "500"}],
          "label-caps": ["12px", {"lineHeight": "1.0", "letterSpacing": "0.15em", "fontWeight": "500"}],
          "headline-sm": ["24px", {"lineHeight": "1.3", "fontWeight": "400"}],
          "display-lg-mobile": ["32px", {"lineHeight": "1.2", "fontWeight": "400"}]
        }
      },
    },
  }
</script>
<style>
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 200, 'GRAD' 0, 'opsz' 24; font-size: 24px; }
</style>
</head>
<body class="bg-background text-on-surface min-h-screen font-body-md">
<div id="nav-container"></div>
<main class="max-w-container-max mx-auto px-margin-desktop py-20">
  <div class="mb-16 max-w-2xl">
    <h1 class="font-display-lg text-display-lg mb-4">Identity Verification</h1>
    <p class="font-body-lg text-body-lg text-tertiary">To ensure the integrity of our architectural retreat community, we require a one-time identity validation.</p>
  </div>
  <div id="kyc-content">
    <p class="text-tertiary">Loading...</p>
  </div>
</main>
<div id="footer-container"></div>
<script src="/js/app.js"></script>
<script>
  if (!isLoggedIn()) window.location.href = '/login.html';

  document.getElementById('nav-container').innerHTML = buildNav('');
  document.getElementById('footer-container').innerHTML = sharedFooter;

  let selectedFile = null;

  function renderUploadState(kyc) {
    const isRejected = kyc && kyc.status === 'Rejected';
    return `
      <div style="display:grid;grid-template-columns:repeat(12,1fr);gap:24px;">
        <section class="col-span-12 lg:col-span-6 flex flex-col gap-8">
          <div class="border border-outline-variant p-10 bg-surface-bright h-full flex flex-col">
            <div class="mb-8">
              <span class="font-label-caps text-label-caps text-tertiary mb-2 block">Step 01</span>
              <h2 class="font-headline-sm text-headline-sm">${isRejected ? 'Re-upload Credentials' : 'Upload Credentials'}</h2>
            </div>
            ${isRejected ? `<div class="mb-6 border border-outline-variant p-4 bg-error-container rounded-lg flex items-start gap-3">
              <span class="material-symbols-outlined text-error">warning</span>
              <p class="text-sm text-error font-body-md">Previous submission was rejected. Please re-submit with a clearer document.</p>
            </div>` : ''}
            <div class="border-2 border-dashed border-outline-variant flex-grow flex flex-col items-center justify-center p-12 transition-all hover:border-primary group cursor-pointer" id="drop-area">
              <span class="material-symbols-outlined text-outline mb-4 group-hover:text-primary transition-colors" style="font-size: 48px;">cloud_upload</span>
              <p class="font-body-md text-body-md text-center mb-2">Drag &amp; drop your ID photo here</p>
              <p class="font-label-caps text-label-caps text-tertiary" id="file-name">JPG, PNG, or PDF (Max 10MB)</p>
              <input accept="image/*,application/pdf" class="hidden" id="fileElem" type="file"/>
            </div>
            <button id="upload-btn" class="mt-8 bg-primary-container text-on-primary-container py-4 px-8 font-ui-label text-ui-label hover:opacity-90 transition-opacity w-full">
              Send for Verification
            </button>
          </div>
        </section>
        <div class="col-span-12 lg:col-span-6 flex flex-col gap-12">
          <div class="border border-outline-variant p-8 bg-surface-container-low flex items-center justify-between">
            <div>
              <h3 class="font-ui-label text-ui-label text-tertiary mb-1">Status: Processing</h3>
              <p class="font-headline-sm text-headline-sm">Verifying your document</p>
            </div>
            <div class="flex items-center justify-center w-12 h-12 rounded-full border border-outline-variant bg-white">
              <span class="material-symbols-outlined text-tertiary animate-pulse">schedule</span>
            </div>
          </div>
          <div class="border border-outline-variant p-8 bg-secondary-container flex items-center justify-between opacity-40">
            <div>
              <h3 class="font-ui-label text-ui-label text-on-secondary-container mb-1">Status: Confirmed</h3>
              <p class="font-headline-sm text-headline-sm">Identity Verified</p>
            </div>
            <div class="flex items-center justify-center w-12 h-12 rounded-full bg-secondary text-white">
              <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
            </div>
          </div>
        </div>
      </div>`;
  }

  function renderPendingState() {
    return `
      <div class="max-w-2xl border border-outline-variant p-10 bg-surface-container-low flex items-center gap-8">
        <div class="flex items-center justify-center w-16 h-16 rounded-full border border-outline-variant bg-white flex-shrink-0">
          <span class="material-symbols-outlined text-tertiary animate-pulse" style="font-size:32px;">schedule</span>
        </div>
        <div>
          <h3 class="font-ui-label text-ui-label text-tertiary mb-1">Status: Processing</h3>
          <p class="font-headline-sm text-headline-sm mb-2">Verifying your document</p>
          <p class="font-body-md text-on-surface-variant">Your identity document is currently being reviewed. This may take up to 24 hours. We'll notify you once the process is complete.</p>
        </div>
      </div>`;
  }

  function renderApprovedState() {
    return `
      <div class="max-w-2xl border border-outline-variant p-10 bg-secondary-container flex items-center gap-8">
        <div class="flex items-center justify-center w-16 h-16 rounded-full bg-secondary text-white flex-shrink-0">
          <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1; font-size:32px;">check_circle</span>
        </div>
        <div>
          <h3 class="font-ui-label text-ui-label text-on-secondary-container mb-1">Status: Confirmed</h3>
          <p class="font-headline-sm text-headline-sm mb-2">Identity Verified</p>
          <p class="font-body-md text-on-secondary-container/80">Your identity has been verified. You can now make reservations across our curated collection.</p>
          <a href="/bookings.html" class="inline-block mt-4 bg-secondary text-white px-6 py-2 font-ui-label text-ui-label hover:opacity-90 transition-opacity">View My Bookings</a>
        </div>
      </div>`;
  }

  async function loadKyc() {
    const content = document.getElementById('kyc-content');
    try {
      const data = await apiFetch('GET', '/kyc/me');
      const kyc = Array.isArray(data) ? data[0] : data;

      if (!kyc || kyc === null) {
        content.innerHTML = renderUploadState(null);
        setupUpload();
      } else if (kyc.status === 'Approved') {
        content.innerHTML = renderApprovedState();
      } else if (kyc.status === 'Pending') {
        content.innerHTML = renderPendingState();
      } else if (kyc.status === 'Rejected') {
        content.innerHTML = renderUploadState(kyc);
        setupUpload();
      } else {
        content.innerHTML = renderUploadState(null);
        setupUpload();
      }
    } catch(err) {
      // No KYC record yet — show upload form
      content.innerHTML = renderUploadState(null);
      setupUpload();
    }
  }

  function setupUpload() {
    const dropArea = document.getElementById('drop-area');
    const fileInput = document.getElementById('fileElem');
    const fileName = document.getElementById('file-name');
    const uploadBtn = document.getElementById('upload-btn');

    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(ev => {
      dropArea.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); }, false);
    });
    ['dragenter', 'dragover'].forEach(ev => {
      dropArea.addEventListener(ev, () => dropArea.classList.add('bg-surface-container'), false);
    });
    ['dragleave', 'drop'].forEach(ev => {
      dropArea.addEventListener(ev, () => dropArea.classList.remove('bg-surface-container'), false);
    });
    dropArea.addEventListener('click', () => fileInput.click());
    dropArea.addEventListener('drop', (e) => {
      const files = e.dataTransfer.files;
      if (files.length > 0) { selectedFile = files[0]; fileName.textContent = files[0].name; }
    });
    fileInput.addEventListener('change', () => {
      if (fileInput.files.length > 0) { selectedFile = fileInput.files[0]; fileName.textContent = fileInput.files[0].name; }
    });

    uploadBtn.addEventListener('click', async () => {
      if (!selectedFile) { showToast('Please select a file first', true); return; }
      uploadBtn.disabled = true;
      uploadBtn.textContent = 'Uploading...';
      try {
        const fd = new FormData();
        fd.append('file', selectedFile);
        await apiFetch('POST', '/kyc/upload', fd, true);
        showToast('Document submitted for verification!');
        setTimeout(() => loadKyc(), 1000);
      } catch(err) {
        showToast(err.message, true);
        uploadBtn.disabled = false;
        uploadBtn.textContent = 'Send for Verification';
      }
    });
  }

  loadKyc();
</script>
</body>
</html>
