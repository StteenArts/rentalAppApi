<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Notifications | Atelier Dwelling</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@100..900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        "colors": {
          "tertiary":"#615c54","inverse-primary":"#ffb5a1","surface-container":"#f0eded",
          "on-secondary-fixed":"#161e09","secondary":"#586247","on-primary":"#ffffff",
          "surface-bright":"#fcf9f8","surface-container-low":"#f6f3f2","surface":"#fcf9f8",
          "primary-container":"#b35c44","inverse-on-surface":"#f3f0f0","on-error":"#ffffff",
          "on-primary-fixed-variant":"#79301b","primary-fixed":"#ffdbd1","error":"#ba1a1a",
          "primary":"#94442e","on-surface":"#1b1c1c","primary-fixed-dim":"#ffb5a1",
          "secondary-container":"#dce7c5","error-container":"#ffdad6","secondary-fixed-dim":"#c0cbaa",
          "background":"#fcf9f8","on-tertiary-container":"#fffcff","on-surface-variant":"#55433e",
          "on-tertiary":"#ffffff","on-secondary-container":"#5e684d","on-primary-container":"#fffcff",
          "on-tertiary-fixed-variant":"#4b463f","surface-variant":"#e4e2e1","surface-container-highest":"#e4e2e1",
          "on-background":"#1b1c1c","tertiary-fixed":"#e9e1d7","inverse-surface":"#303030",
          "on-primary-fixed":"#3b0900","outline":"#88726d","surface-dim":"#dcd9d9",
          "surface-tint":"#974730","on-secondary-fixed-variant":"#414a31","on-secondary":"#ffffff",
          "tertiary-fixed-dim":"#cdc5bc","outline-variant":"#dbc1ba","surface-container-high":"#eae7e7",
          "secondary-fixed":"#dce7c5","on-tertiary-fixed":"#1e1b15","on-error-container":"#93000a",
          "surface-container-lowest":"#ffffff","tertiary-container":"#7a746c"
        },
        "borderRadius":{"DEFAULT":"0.125rem","lg":"0.25rem","xl":"0.5rem","full":"0.75rem"},
        "spacing":{"unit":"8px","container-max":"1280px","gutter":"24px","margin-mobile":"20px","margin-desktop":"64px"},
        "fontFamily":{"display-lg":["Playfair Display"],"body-lg":["Inter"],"body-md":["Inter"],"headline-md":["Playfair Display"],"ui-label":["Inter"],"label-caps":["Inter"],"headline-sm":["Playfair Display"],"display-lg-mobile":["Playfair Display"]},
        "fontSize":{
          "display-lg":["48px",{"lineHeight":"1.1","letterSpacing":"-0.02em","fontWeight":"400"}],
          "body-lg":["18px",{"lineHeight":"1.6","fontWeight":"400"}],
          "body-md":["16px",{"lineHeight":"1.5","fontWeight":"400"}],
          "headline-md":["32px",{"lineHeight":"1.2","fontWeight":"400"}],
          "ui-label":["14px",{"lineHeight":"1.2","fontWeight":"500"}],
          "label-caps":["12px",{"lineHeight":"1.0","letterSpacing":"0.15em","fontWeight":"500"}],
          "headline-sm":["24px",{"lineHeight":"1.3","fontWeight":"400"}],
          "display-lg-mobile":["32px",{"lineHeight":"1.2","fontWeight":"400"}]
        }
      }
    }
  }
</script>
<style>
  body { background-color: #fcf9f8; color: #1b1c1c; -webkit-font-smoothing: antialiased; }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24; font-size: 20px; }
  .notif-item { transition: background-color 0.2s ease; }
</style>
</head>
<body class="font-body-md text-body-md min-h-screen">
<div id="nav-container"></div>
<main class="max-w-container-max mx-auto px-margin-desktop py-20">

  <!-- Header -->
  <div class="flex flex-col md:flex-row md:items-end justify-between mb-16 gap-6">
    <div>
      <span class="font-label-caps text-label-caps text-primary tracking-[0.2em] uppercase mb-2 block">Inbox</span>
      <h1 class="font-display-lg text-display-lg">Notifications</h1>
    </div>
    <button id="mark-all-btn" class="font-ui-label text-ui-label text-primary hover:underline transition-all self-end">
      Mark all as read
    </button>
  </div>

  <!-- Tabs: All / Unread -->
  <div class="flex gap-8 border-b border-outline-variant mb-12">
    <button id="tab-all" class="pb-4 font-ui-label text-ui-label text-primary border-b-2 border-primary -mb-px transition-colors">All</button>
    <button id="tab-unread" class="pb-4 font-ui-label text-ui-label text-on-surface-variant border-b-2 border-transparent -mb-px hover:text-primary transition-colors">Unread <span id="unread-count" class="ml-1 bg-primary text-on-primary text-[10px] font-label-caps rounded-full px-2 py-0.5">0</span></button>
  </div>

  <!-- List -->
  <div id="notif-list" class="divide-y divide-outline-variant border border-outline-variant bg-surface">
    <div class="py-16 text-center text-tertiary font-body-md">Loading…</div>
  </div>

  <!-- Empty state -->
  <div id="empty-state" class="hidden flex-col items-center justify-center py-32 text-center">
    <span class="material-symbols-outlined text-6xl text-outline-variant mb-6" style="font-variation-settings:'wght' 200;">notifications_off</span>
    <h2 class="font-headline-sm text-headline-sm mb-2">No notifications</h2>
    <p class="font-body-md text-tertiary">You're all caught up. Come back later.</p>
  </div>

</main>
<div id="footer-container"></div>
<script src="/js/app.js"></script>
<script>
  document.getElementById('nav-container').innerHTML = buildNav('notifications');
  document.getElementById('footer-container').innerHTML = sharedFooter;

  if (!isLoggedIn()) window.location.href = '/login.html';

  let allNotifs = [];
  let showUnreadOnly = false;

  function relativeTime(dateStr) {
    const d = new Date(dateStr);
    const diff = Date.now() - d.getTime();
    const mins = Math.floor(diff / 60000);
    if (mins < 1) return 'Just now';
    if (mins < 60) return `${mins}m ago`;
    const hours = Math.floor(mins / 60);
    if (hours < 24) return `${hours}h ago`;
    const days = Math.floor(hours / 24);
    if (days < 7) return `${days}d ago`;
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  }

  function renderNotif(n) {
    const unreadDot = n.isRead
      ? '<div class="w-2 h-2 rounded-full shrink-0 mt-2 bg-transparent"></div>'
      : '<div class="w-2 h-2 rounded-full shrink-0 mt-2 bg-primary"></div>';

    return `
      <div class="notif-item group px-8 py-6 cursor-pointer hover:bg-surface-container-low ${n.isRead ? 'opacity-70' : ''}" data-id="${n.id}" data-read="${n.isRead}">
        <div class="flex gap-4">
          ${unreadDot}
          <div class="flex-1">
            <div class="flex justify-between items-start mb-1">
              <span class="font-ui-label text-ui-label text-on-surface ${n.isRead ? '' : 'font-semibold'}">${n.title}</span>
              <span class="font-label-caps text-[10px] text-tertiary ml-4 shrink-0">${relativeTime(n.createdAt)}</span>
            </div>
            <p class="font-body-md text-sm text-on-surface-variant leading-relaxed">${n.message}</p>
          </div>
        </div>
      </div>`;
  }

  function render() {
    const list = showUnreadOnly ? allNotifs.filter(n => !n.isRead) : allNotifs;
    const container = document.getElementById('notif-list');
    const empty = document.getElementById('empty-state');

    const unread = allNotifs.filter(n => !n.isRead).length;
    document.getElementById('unread-count').textContent = unread;

    if (!list.length) {
      container.classList.add('hidden');
      empty.classList.remove('hidden');
      empty.classList.add('flex');
      return;
    }
    container.classList.remove('hidden');
    empty.classList.add('hidden');
    empty.classList.remove('flex');
    container.innerHTML = list.map(renderNotif).join('');

    container.querySelectorAll('.notif-item').forEach(item => {
      item.addEventListener('click', async () => {
        if (item.dataset.read === 'true') return;
        try {
          await apiFetch('PUT', `/notifications/read/${item.dataset.id}`);
          const notif = allNotifs.find(n => n.id === item.dataset.id);
          if (notif) notif.isRead = true;
          render();
        } catch(err) { showToast(err.message, true); }
      });
    });
  }

  async function load() {
    try {
      allNotifs = await apiFetch('GET', '/notifications');
      if (!Array.isArray(allNotifs)) allNotifs = [];
      render();
    } catch(err) {
      document.getElementById('notif-list').innerHTML = `<div class="py-12 text-center text-error font-body-md">${err.message}</div>`;
      showToast(err.message, true);
    }
  }

  document.getElementById('tab-all').addEventListener('click', () => {
    showUnreadOnly = false;
    document.getElementById('tab-all').classList.add('text-primary', 'border-primary');
    document.getElementById('tab-all').classList.remove('text-on-surface-variant', 'border-transparent');
    document.getElementById('tab-unread').classList.remove('text-primary', 'border-primary');
    document.getElementById('tab-unread').classList.add('text-on-surface-variant', 'border-transparent');
    render();
  });

  document.getElementById('tab-unread').addEventListener('click', () => {
    showUnreadOnly = true;
    document.getElementById('tab-unread').classList.add('text-primary', 'border-primary');
    document.getElementById('tab-unread').classList.remove('text-on-surface-variant', 'border-transparent');
    document.getElementById('tab-all').classList.remove('text-primary', 'border-primary');
    document.getElementById('tab-all').classList.add('text-on-surface-variant', 'border-transparent');
    render();
  });

  document.getElementById('mark-all-btn').addEventListener('click', async () => {
    const unread = allNotifs.filter(n => !n.isRead);
    if (!unread.length) { showToast('All already read'); return; }
    try {
      await Promise.all(unread.map(n => apiFetch('PUT', `/notifications/read/${n.id}`)));
      allNotifs.forEach(n => n.isRead = true);
      render();
      showToast('All notifications marked as read');
    } catch(err) { showToast(err.message, true); }
  });

  load();
</script>
</body>
</html>
