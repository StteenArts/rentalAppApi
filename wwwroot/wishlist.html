<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Wishlist | Atelier Dwelling</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@100..900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        "colors": {
          "tertiary": "#615c54","inverse-primary": "#ffb5a1","surface-container": "#f0eded",
          "on-secondary-fixed": "#161e09","secondary": "#586247","on-primary": "#ffffff",
          "surface-bright": "#fcf9f8","surface-container-low": "#f6f3f2","surface": "#fcf9f8",
          "primary-container": "#b35c44","inverse-on-surface": "#f3f0f0","on-error": "#ffffff",
          "on-primary-fixed-variant": "#79301b","primary-fixed": "#ffdbd1","error": "#ba1a1a",
          "primary": "#94442e","on-surface": "#1b1c1c","primary-fixed-dim": "#ffb5a1",
          "secondary-container": "#dce7c5","error-container": "#ffdad6","secondary-fixed-dim": "#c0cbaa",
          "background": "#fcf9f8","on-tertiary-container": "#fffcff","on-surface-variant": "#55433e",
          "on-tertiary": "#ffffff","on-secondary-container": "#5e684d","on-primary-container": "#fffcff",
          "on-tertiary-fixed-variant": "#4b463f","surface-variant": "#e4e2e1","surface-container-highest": "#e4e2e1",
          "on-background": "#1b1c1c","tertiary-fixed": "#e9e1d7","inverse-surface": "#303030",
          "on-primary-fixed": "#3b0900","outline": "#88726d","surface-dim": "#dcd9d9",
          "surface-tint": "#974730","on-secondary-fixed-variant": "#414a31","on-secondary": "#ffffff",
          "tertiary-fixed-dim": "#cdc5bc","outline-variant": "#dbc1ba","surface-container-high": "#eae7e7",
          "secondary-fixed": "#dce7c5","on-tertiary-fixed": "#1e1b15","on-error-container": "#93000a",
          "surface-container-lowest": "#ffffff","tertiary-container": "#7a746c"
        },
        "borderRadius": {"DEFAULT": "0.125rem","lg": "0.25rem","xl": "0.5rem","full": "0.75rem"},
        "spacing": {"unit": "8px","container-max": "1280px","gutter": "24px","margin-mobile": "20px","margin-desktop": "64px"},
        "fontFamily": {"display-lg": ["Playfair Display"],"body-lg": ["Inter"],"body-md": ["Inter"],"headline-md": ["Playfair Display"],"ui-label": ["Inter"],"label-caps": ["Inter"],"headline-sm": ["Playfair Display"],"display-lg-mobile": ["Playfair Display"]},
        "fontSize": {
          "display-lg": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "400"}],
          "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
          "body-md": ["16px", {"lineHeight": "1.5", "fontWeight": "400"}],
          "headline-md": ["32px", {"lineHeight": "1.2", "fontWeight": "400"}],
          "ui-label": ["14px", {"lineHeight": "1.2", "fontWeight": "500"}],
          "label-caps": ["12px", {"lineHeight": "1.0", "letterSpacing": "0.15em", "fontWeight": "500"}],
          "headline-sm": ["24px", {"lineHeight": "1.3", "fontWeight": "400"}],
          "display-lg-mobile": ["32px", {"lineHeight": "1.2", "fontWeight": "400"}]
        }
      },
    },
  }
</script>
<style>
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24; transition: all 0.3s ease; }
  .fill-icon { font-variation-settings: 'FILL' 1, 'wght' 300, 'GRAD' 0, 'opsz' 24; }
  body { background-color: #fcf9f8; -webkit-font-smoothing: antialiased; }
  .card-hover-effect { transition: transform 0.4s cubic-bezier(0.2, 1, 0.3, 1); }
  .card-hover-effect:hover { transform: translateY(-4px); }
</style>
</head>
<body class="bg-surface font-body-md text-on-surface">
<div id="nav-container"></div>
<main class="max-w-container-max mx-auto px-margin-desktop py-20">
  <div class="mb-16">
    <h1 class="font-display-lg text-display-lg text-on-surface mb-2">Saved Sanctuary</h1>
    <p class="font-body-lg text-body-lg text-tertiary max-w-xl">A curated collection of your most-admired architectural retreats.</p>
  </div>
  <div id="wishlist-content">
    <div id="wishlist-grid" class="grid grid-cols-1 md:grid-cols-3 gap-x-gutter gap-y-16">
      <p class="col-span-3 text-center text-tertiary py-20">Loading...</p>
    </div>
  </div>
  <div class="hidden flex-col items-center justify-center py-40 text-center" id="empty-state">
    <div class="mb-8 p-10 bg-surface-container-low rounded-full">
      <span class="material-symbols-outlined text-outline text-6xl">auto_awesome</span>
    </div>
    <h2 class="font-headline-md text-headline-md mb-4 text-on-surface">No saved properties</h2>
    <p class="font-body-md text-body-md text-tertiary mb-10 max-w-md">Your wishlist is currently waiting for inspiration.</p>
    <a href="/index.html" class="bg-primary text-on-primary px-8 py-4 font-ui-label text-ui-label hover:opacity-90 transition-opacity tracking-wider">Explore properties</a>
  </div>
</main>
<div id="footer-container"></div>
<script src="/js/app.js"></script>
<script>
  if (!isLoggedIn()) window.location.href = '/login.html';

  document.getElementById('nav-container').innerHTML = buildNav('wishlist');
  document.getElementById('footer-container').innerHTML = sharedFooter;

  const PLACEHOLDER = 'https://images.unsplash.com/photo-1449844908441-8829872d2607?w=800&q=80';

  function renderCard(item) {
    const p = item.property || {};
    const img = getPropertyImage(p);
    return `
      <div class="group cursor-pointer card-hover-effect wishlist-card" data-pid="${item.propertyId}" data-id="${item.id}">
        <div class="relative mb-6 overflow-hidden aspect-[4/5] rounded-lg">
          <img class="w-full h-full object-cover grayscale-[20%] group-hover:grayscale-0 transition-all duration-700" src="${img}" alt="${p.title || ''}" onerror="this.src='${PLACEHOLDER}'"/>
          <button aria-label="Remove from wishlist" class="remove-btn absolute top-4 right-4 bg-surface/90 p-2 rounded-full flex items-center justify-center hover:scale-110 transition-transform shadow-sm">
            <span class="material-symbols-outlined text-primary fill-icon" style="font-variation-settings: 'FILL' 1;">favorite</span>
          </button>
        </div>
        <div class="flex justify-between items-start">
          <div>
            <h3 class="font-headline-sm text-headline-sm mb-1">${p.title || 'Property'}</h3>
            <p class="font-body-md text-body-md text-tertiary mb-3">${p.city || ''}</p>
            <div class="flex items-center gap-2">
              <span class="font-ui-label text-ui-label text-primary">$${p.pricePerNight || '—'}</span>
              <span class="font-label-caps text-label-caps text-on-surface-variant">/ NIGHT</span>
            </div>
          </div>
        </div>
      </div>`;
  }

  function checkEmpty() {
    const remaining = document.querySelectorAll('.wishlist-card');
    if (remaining.length === 0) {
      document.getElementById('wishlist-content').classList.add('hidden');
      const es = document.getElementById('empty-state');
      es.classList.remove('hidden');
      es.classList.add('flex');
    }
  }

  async function loadWishlist() {
    const grid = document.getElementById('wishlist-grid');
    const empty = document.getElementById('empty-state');
    try {
      const data = await apiFetch('GET', '/wishlist');
      const list = Array.isArray(data) ? data : (data.items || data.data || []);
      grid.innerHTML = '';
      if (!list.length) {
        document.getElementById('wishlist-content').classList.add('hidden');
        empty.classList.remove('hidden');
        empty.classList.add('flex');
        return;
      }
      list.forEach(item => grid.insertAdjacentHTML('beforeend', renderCard(item)));

      // Card click
      grid.querySelectorAll('.wishlist-card').forEach(card => {
        card.addEventListener('click', (e) => {
          if (e.target.closest('.remove-btn')) return;
          window.location.href = `/property.html?id=${card.dataset.pid}`;
        });
      });

      // Remove button
      grid.querySelectorAll('.remove-btn').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          const card = btn.closest('.wishlist-card');
          const pid = card.dataset.pid;
          try {
            await apiFetch('DELETE', `/wishlist/${pid}`);
            card.style.opacity = '0';
            card.style.transform = 'scale(0.95)';
            card.style.transition = 'all 0.5s ease';
            setTimeout(() => { card.remove(); checkEmpty(); }, 500);
            showToast('Removed from wishlist');
          } catch(err) { showToast(err.message, true); }
        });
      });
    } catch(err) {
      grid.innerHTML = '';
      showToast(err.message, true);
      empty.classList.remove('hidden');
      empty.classList.add('flex');
    }
  }

  loadWishlist();
</script>
</body>
</html>
