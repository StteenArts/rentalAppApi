<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>My Properties | Atelier Dwelling</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@100..900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        "colors": {
          "tertiary": "#615c54","inverse-primary": "#ffb5a1","surface-container": "#f0eded",
          "on-secondary-fixed": "#161e09","secondary": "#586247","on-primary": "#ffffff",
          "surface-bright": "#fcf9f8","surface-container-low": "#f6f3f2","surface": "#fcf9f8",
          "primary-container": "#b35c44","inverse-on-surface": "#f3f0f0","on-error": "#ffffff",
          "on-primary-fixed-variant": "#79301b","primary-fixed": "#ffdbd1","error": "#ba1a1a",
          "primary": "#94442e","on-surface": "#1b1c1c","primary-fixed-dim": "#ffb5a1",
          "secondary-container": "#dce7c5","error-container": "#ffdad6","secondary-fixed-dim": "#c0cbaa",
          "background": "#fcf9f8","on-tertiary-container": "#fffcff","on-surface-variant": "#55433e",
          "on-tertiary": "#ffffff","on-secondary-container": "#5e684d","on-primary-container": "#fffcff",
          "on-tertiary-fixed-variant": "#4b463f","surface-variant": "#e4e2e1","surface-container-highest": "#e4e2e1",
          "on-background": "#1b1c1c","tertiary-fixed": "#e9e1d7","inverse-surface": "#303030",
          "on-primary-fixed": "#3b0900","outline": "#88726d","surface-dim": "#dcd9d9",
          "surface-tint": "#974730","on-secondary-fixed-variant": "#414a31","on-secondary": "#ffffff",
          "tertiary-fixed-dim": "#cdc5bc","outline-variant": "#dbc1ba","surface-container-high": "#eae7e7",
          "secondary-fixed": "#dce7c5","on-tertiary-fixed": "#1e1b15","on-error-container": "#93000a",
          "surface-container-lowest": "#ffffff","tertiary-container": "#7a746c"
        },
        "borderRadius": {"DEFAULT": "0.125rem","lg": "0.25rem","xl": "0.5rem","full": "0.75rem"},
        "spacing": {"unit": "8px","container-max": "1280px","gutter": "24px","margin-mobile": "20px","margin-desktop": "64px"},
        "fontFamily": {"display-lg": ["Playfair Display"],"body-lg": ["Inter"],"body-md": ["Inter"],"headline-md": ["Playfair Display"],"ui-label": ["Inter"],"label-caps": ["Inter"],"headline-sm": ["Playfair Display"],"display-lg-mobile": ["Playfair Display"]},
        "fontSize": {
          "display-lg": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "400"}],
          "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
          "body-md": ["16px", {"lineHeight": "1.5", "fontWeight": "400"}],
          "headline-md": ["32px", {"lineHeight": "1.2", "fontWeight": "400"}],
          "ui-label": ["14px", {"lineHeight": "1.2", "fontWeight": "500"}],
          "label-caps": ["12px", {"lineHeight": "1.0", "letterSpacing": "0.15em", "fontWeight": "500"}],
          "headline-sm": ["24px", {"lineHeight": "1.3", "fontWeight": "400"}],
          "display-lg-mobile": ["32px", {"lineHeight": "1.2", "fontWeight": "400"}]
        }
      },
    },
  }
</script>
<style>
  body { background-color: #FAF6F0; -webkit-font-smoothing: antialiased; }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24; vertical-align: middle; }
  .editorial-border { border-color: #E5DDD3; }
</style>
</head>
<body class="font-body-md text-on-surface">
<div id="nav-container"></div>
<main class="max-w-container-max mx-auto px-margin-desktop py-20 min-h-[calc(100vh-280px)]">
  <div class="flex flex-col md:flex-row md:items-end justify-between mb-16 gap-gutter">
    <div>
      <h1 class="font-display-lg text-display-lg mb-4">Inventory</h1>
      <p class="font-body-md text-tertiary max-w-xl">Manage your collection of architectural retreats.</p>
    </div>
    <a href="/create-property.html" class="bg-primary text-on-primary px-6 py-3 font-ui-label text-ui-label hover:opacity-90 transition-opacity inline-block">
      Publish New Property
    </a>
  </div>
  <!-- Properties Table -->
  <div id="table-container" class="bg-surface rounded-DEFAULT border editorial-border overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="bg-surface-container-low border-b editorial-border">
            <th class="px-8 py-6 font-label-caps text-label-caps text-tertiary">Property</th>
            <th class="px-8 py-6 font-label-caps text-label-caps text-tertiary">Location</th>
            <th class="px-8 py-6 font-label-caps text-label-caps text-tertiary">Price/Night</th>
            <th class="px-8 py-6 font-label-caps text-label-caps text-tertiary">Status</th>
            <th class="px-8 py-6 font-label-caps text-label-caps text-tertiary text-right">Actions</th>
          </tr>
        </thead>
        <tbody id="properties-tbody" class="divide-y editorial-border">
          <tr><td colspan="5" class="px-8 py-12 text-center text-tertiary">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
  <!-- Empty State -->
  <div class="hidden flex-col items-center justify-center py-32 bg-surface rounded-DEFAULT border border-dashed editorial-border" id="empty-state">
    <span class="material-symbols-outlined text-6xl text-outline-variant mb-6" style="font-variation-settings: 'wght' 200;">domain</span>
    <h2 class="font-headline-sm text-headline-sm mb-2">No properties published</h2>
    <p class="font-body-md text-tertiary mb-8 text-center max-w-sm">Start your journey by adding your first architectural masterpiece.</p>
    <a href="/create-property.html" class="bg-primary text-on-primary px-8 py-4 font-ui-label text-ui-label hover:opacity-90 transition-all flex items-center gap-2">
      <span class="material-symbols-outlined">add</span>
      Publish first one
    </a>
  </div>
</main>
<div id="footer-container"></div>
<script src="/js/app.js"></script>
<script>
  if (!isLoggedIn()) window.location.href = '/login.html';
  if (!isOwner() && !isAdmin()) window.location.href = '/index.html';

  document.getElementById('nav-container').innerHTML = buildNav('my-properties');
  document.getElementById('footer-container').innerHTML = sharedFooter;

  const PLACEHOLDER = 'https://images.unsplash.com/photo-1449844908441-8829872d2607?w=800&q=80';

  function renderRow(p) {
    const img = getPropertyImage(p);
    const isActive = p.isActive !== false;
    return `
      <tr class="hover:bg-surface-bright transition-colors" data-id="${p.id}">
        <td class="px-8 py-6">
          <div class="flex items-center gap-4">
            <div class="w-16 h-16 overflow-hidden rounded-lg bg-surface-container flex-shrink-0">
              <img class="w-full h-full object-cover" src="${img}" alt="${p.title}" onerror="this.src='${PLACEHOLDER}'"/>
            </div>
            <span class="font-headline-sm text-headline-sm text-[20px]">${p.title}</span>
          </div>
        </td>
        <td class="px-8 py-6 font-body-md text-tertiary">
          <span class="flex items-center gap-2">
            <span class="material-symbols-outlined text-lg">location_on</span>
            ${p.city}
          </span>
        </td>
        <td class="px-8 py-6 font-body-md"><span class="text-on-surface">$${p.pricePerNight}</span></td>
        <td class="px-8 py-6">
          <span class="inline-flex items-center px-3 py-1 ${isActive ? 'bg-secondary-container text-on-secondary-container' : 'bg-surface-variant text-on-surface-variant'} rounded-DEFAULT font-label-caps text-[10px]">
            ${isActive ? 'ACTIVE' : 'INACTIVE'}
          </span>
        </td>
        <td class="px-8 py-6 text-right">
          <div class="flex items-center justify-end gap-4 text-tertiary">
            <button class="edit-btn hover:text-primary transition-colors flex items-center gap-1" title="Edit Listing">
              <span class="material-symbols-outlined">edit_square</span>
              <span class="font-label-caps text-[10px]">EDIT</span>
            </button>
            <a href="/create-property.html?id=${p.id}#images" class="hover:text-primary transition-colors flex items-center gap-1">
              <span class="material-symbols-outlined">photo_library</span>
              <span class="font-label-caps text-[10px]">PHOTOS</span>
            </a>
            <button class="delete-btn hover:text-error transition-colors">
              <span class="material-symbols-outlined">delete</span>
            </button>
          </div>
        </td>
      </tr>`;
  }

  async function loadProperties() {
    const tbody = document.getElementById('properties-tbody');
    const empty = document.getElementById('empty-state');
    try {
      const endpoint = isAdmin() ? '/properties' : '/properties/mine';
      const data = await apiFetch('GET', endpoint);
      const list = Array.isArray(data) ? data : (data.items || data.data || []);
      tbody.innerHTML = '';
      if (!list.length) {
        document.getElementById('table-container').classList.add('hidden');
        empty.classList.remove('hidden');
        empty.classList.add('flex');
        return;
      }
      list.forEach(p => tbody.insertAdjacentHTML('beforeend', renderRow(p)));
      attachRowHandlers();
    } catch(err) {
      tbody.innerHTML = `<tr><td colspan="5" class="px-8 py-12 text-center text-error">${err.message}</td></tr>`;
    }
  }

  function attachRowHandlers() {
    document.querySelectorAll('.edit-btn').forEach(btn => {
      const row = btn.closest('tr');
      btn.addEventListener('click', () => {
        window.location.href = `/create-property.html?id=${row.dataset.id}`;
      });
    });
    document.querySelectorAll('.delete-btn').forEach(btn => {
      const row = btn.closest('tr');
      btn.addEventListener('click', async () => {
        if (!confirm('Remove this property from the atelier?')) return;
        try {
          await apiFetch('DELETE', `/properties/${row.dataset.id}`);
          row.style.opacity = '0';
          row.style.transform = 'translateX(20px)';
          row.style.transition = 'all 0.4s ease';
          setTimeout(() => { row.remove(); checkEmpty(); }, 400);
          showToast('Property deleted');
        } catch(err) { showToast(err.message, true); }
      });
    });
  }

  function checkEmpty() {
    if (document.querySelectorAll('#properties-tbody tr').length === 0) {
      document.getElementById('table-container').classList.add('hidden');
      const e = document.getElementById('empty-state');
      e.classList.remove('hidden');
      e.classList.add('flex');
    }
  }

  loadProperties();
</script>
</body>
</html>
