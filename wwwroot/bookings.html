<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>My Bookings | Atelier Dwelling</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@100..900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        "colors": {
          "tertiary": "#615c54","inverse-primary": "#ffb5a1","surface-container": "#f0eded",
          "on-secondary-fixed": "#161e09","secondary": "#586247","on-primary": "#ffffff",
          "surface-bright": "#fcf9f8","surface-container-low": "#f6f3f2","surface": "#fcf9f8",
          "primary-container": "#b35c44","inverse-on-surface": "#f3f0f0","on-error": "#ffffff",
          "on-primary-fixed-variant": "#79301b","primary-fixed": "#ffdbd1","error": "#ba1a1a",
          "primary": "#94442e","on-surface": "#1b1c1c","primary-fixed-dim": "#ffb5a1",
          "secondary-container": "#dce7c5","error-container": "#ffdad6","secondary-fixed-dim": "#c0cbaa",
          "background": "#fcf9f8","on-tertiary-container": "#fffcff","on-surface-variant": "#55433e",
          "on-tertiary": "#ffffff","on-secondary-container": "#5e684d","on-primary-container": "#fffcff",
          "on-tertiary-fixed-variant": "#4b463f","surface-variant": "#e4e2e1","surface-container-highest": "#e4e2e1",
          "on-background": "#1b1c1c","tertiary-fixed": "#e9e1d7","inverse-surface": "#303030",
          "on-primary-fixed": "#3b0900","outline": "#88726d","surface-dim": "#dcd9d9",
          "surface-tint": "#974730","on-secondary-fixed-variant": "#414a31","on-secondary": "#ffffff",
          "tertiary-fixed-dim": "#cdc5bc","outline-variant": "#dbc1ba","surface-container-high": "#eae7e7",
          "secondary-fixed": "#dce7c5","on-tertiary-fixed": "#1e1b15","on-error-container": "#93000a",
          "surface-container-lowest": "#ffffff","tertiary-container": "#7a746c"
        },
        "borderRadius": {"DEFAULT": "0.125rem","lg": "0.25rem","xl": "0.5rem","full": "0.75rem"},
        "spacing": {"unit": "8px","container-max": "1280px","gutter": "24px","margin-mobile": "20px","margin-desktop": "64px"},
        "fontFamily": {"display-lg": ["Playfair Display"],"body-lg": ["Inter"],"body-md": ["Inter"],"headline-md": ["Playfair Display"],"ui-label": ["Inter"],"label-caps": ["Inter"],"headline-sm": ["Playfair Display"],"display-lg-mobile": ["Playfair Display"]},
        "fontSize": {
          "display-lg": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "400"}],
          "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
          "body-md": ["16px", {"lineHeight": "1.5", "fontWeight": "400"}],
          "headline-md": ["32px", {"lineHeight": "1.2", "fontWeight": "400"}],
          "ui-label": ["14px", {"lineHeight": "1.2", "fontWeight": "500"}],
          "label-caps": ["12px", {"lineHeight": "1.0", "letterSpacing": "0.15em", "fontWeight": "500"}],
          "headline-sm": ["24px", {"lineHeight": "1.3", "fontWeight": "400"}],
          "display-lg-mobile": ["32px", {"lineHeight": "1.2", "fontWeight": "400"}]
        }
      },
    },
  }
</script>
<style>
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24; vertical-align: middle; }
  body { background-color: #FAF6F0; color: #1b1c1c; }
  .editorial-divider { height: 1px; background-color: #E5DDD3; width: 100%; }
  .booking-card { border: 1px solid #E5DDD3; transition: border-color 0.3s ease; }
  .booking-card:hover { border-color: #94442e; }
</style>
</head>
<body class="font-body-md text-body-md antialiased">
<div id="nav-container"></div>
<main class="min-h-screen pt-20 pb-32">
  <div class="max-w-container-max mx-auto px-margin-mobile md:px-margin-desktop">
    <div class="mb-20">
      <h1 class="font-display-lg text-display-lg text-on-surface mb-4">My Bookings</h1>
      <p class="font-body-lg text-body-lg text-tertiary max-w-2xl">Manage your upcoming retreats and review past journeys.</p>
    </div>
    <div class="space-y-gutter" id="bookings-container">
      <p class="text-tertiary py-20 text-center">Loading...</p>
    </div>
    <div class="hidden flex flex-col items-center justify-center py-32 text-center" id="empty-state">
      <h3 class="font-headline-md text-headline-md text-on-surface mb-4">No bookings yet</h3>
      <p class="font-body-md text-body-md text-tertiary max-w-sm mb-10">Your journey of intentional living hasn't started.</p>
      <a href="/index.html" class="bg-primary text-white px-12 py-4 font-ui-label tracking-widest hover:bg-primary-container transition-colors duration-300">EXPLORE PROPERTIES</a>
    </div>
  </div>
</main>
<div id="footer-container"></div>
<script src="/js/app.js"></script>
<script>
  if (!isLoggedIn()) window.location.href = '/login.html';

  document.getElementById('nav-container').innerHTML = buildNav('bookings');
  document.getElementById('footer-container').innerHTML = sharedFooter;

  const PLACEHOLDER = 'https://images.unsplash.com/photo-1449844908441-8829872d2607?w=800&q=80';

  function getStatusBadge(status) {
    if (status === 'Confirmed') return '<span class="font-label-caps text-label-caps px-2 py-1 bg-secondary-container text-on-secondary-container rounded-sm inline-block w-fit">Confirmed</span>';
    if (status === 'Cancelled' || status === 'Canceled') return '<span class="font-label-caps text-label-caps px-2 py-1 bg-surface-variant text-on-surface-variant rounded-sm inline-block w-fit">Cancelled</span>';
    return `<span class="font-label-caps text-label-caps px-2 py-1 bg-surface-container text-tertiary rounded-sm inline-block w-fit">${status}</span>`;
  }

  function renderBooking(r) {
    const title = r.property?.title || `Property #${r.propertyId?.slice(0,8) || ''}`;
    const city = r.property?.city || '';
    const img = r.property ? getPropertyImage(r.property) : PLACEHOLDER;
    const isCancelled = r.status === 'Cancelled' || r.status === 'Canceled';
    const cancelBtn = !isCancelled ? `<button class="cancel-btn px-6 py-2 border border-error text-error font-ui-label hover:bg-error hover:text-white transition-all duration-300" data-id="${r.id}">Cancel</button>` : '';

    return `
      <div class="booking-card bg-surface p-6 flex flex-col md:flex-row gap-8 items-center rounded-lg ${isCancelled ? 'opacity-70' : ''}">
        <div class="w-full md:w-48 h-32 flex-shrink-0 ${isCancelled ? 'grayscale' : ''}">
          <img class="w-full h-full object-cover rounded-lg" src="${img}" alt="${title}" onerror="this.src='${PLACEHOLDER}'"/>
        </div>
        <div class="flex-grow space-y-2 text-center md:text-left">
          <div class="flex flex-col md:flex-row md:items-center gap-3">
            ${getStatusBadge(r.status)}
            <h2 class="font-headline-sm text-headline-sm">${title}</h2>
          </div>
          ${city ? `<p class="text-tertiary font-ui-label text-xs uppercase tracking-wider">${city}</p>` : ''}
          <p class="text-tertiary font-ui-label">${formatDate(r.checkIn)} — ${formatDate(r.checkOut)}</p>
          <p class="font-ui-label ${isCancelled ? 'text-tertiary line-through' : 'text-primary font-bold'}">$${r.totalAmount?.toFixed(2) || '—'}</p>
        </div>
        <div class="flex gap-4 items-center">
          <a href="/property.html?id=${r.propertyId}" class="px-6 py-2 border border-outline-variant text-primary font-ui-label hover:bg-primary hover:text-white transition-all duration-300">View Details</a>
          ${cancelBtn}
        </div>
      </div>`;
  }

  async function loadBookings() {
    const container = document.getElementById('bookings-container');
    const empty = document.getElementById('empty-state');
    try {
      const data = await apiFetch('GET', '/reservations/my');
      const list = Array.isArray(data) ? data : (data.items || data.data || []);
      container.innerHTML = '';
      if (!list.length) { empty.classList.remove('hidden'); empty.classList.add('flex'); return; }
      list.forEach(r => container.insertAdjacentHTML('beforeend', renderBooking(r)));
      // Cancel buttons
      container.querySelectorAll('.cancel-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          if (!confirm('Are you sure you want to cancel this reservation?')) return;
          try {
            await apiFetch('POST', `/reservations/${btn.dataset.id}/cancel`);
            showToast('Reservation cancelled');
            loadBookings();
          } catch(err) { showToast(err.message, true); }
        });
      });
    } catch(err) {
      container.innerHTML = '';
      showToast(err.message, true);
      empty.classList.remove('hidden');
      empty.classList.add('flex');
    }
  }

  loadBookings();
</script>
</body>
</html>
