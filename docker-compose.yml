version: '3.9'

services:

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rental_api
    ports:
      - "5000:8080"
    depends_on:
      - postgres
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=RentalAppDb;Username=postgres;Password=postgres

  postgres:
    image: postgres:15
    container_name: rental_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: RentalAppDb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: